# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.0.0.67:5433/starcreator_p}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:starcreator_prod}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prodpass456}

# Let Flyway handle migrations, Hibernate validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Don't run SQL init scripts in prod
spring.sql.init.mode=never

# Probability Report API Key
probability-report.api-key=${PROBABILITY_REPORT_API_KEY:prod-prob-report-key-2026}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://10.0.0.67:3000,http://10.0.0.67:9000,http://localhost:5173,http://stellarfoundry.brickroadsoftware.com,http://starcreator.brickroadsoftware.com,http://kquaxistaltz.brickroadsoftware.com}